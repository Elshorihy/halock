name: Build HALOCK Bridge Android

on:
  push:
    branches: [feat/halock-android-bridge]
    paths:
      - 'android-bridge/**'
      - '.github/workflows/android-bridge.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android-bridge/**'
      - '.github/workflows/android-bridge.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android-bridge
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: halock-bridge-debug-apk
          path: android-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
