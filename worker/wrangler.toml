# HALOCK — Cloudflare Worker configuration
name = "halock"
main = "./index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Serve the built frontend from the repository root dist/ directory.
[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Existing production D1 database.
[[d1_databases]]
binding = "DB"
database_name = "halock-db"
database_id = "bfc96865-a8df-4044-8fd0-5ee1b97f726a"

[vars]
ALLOWED_ORIGIN = "*"
SESSION_TTL_DAYS = "30"
