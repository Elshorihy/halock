# HALOCK — Cloudflare Worker configuration
name = "halock-api"
main = "worker/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Serve the built frontend from the same Worker (single origin → no CORS issues).
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# D1 database (create with: wrangler d1 create halock-db, then paste the id below).
[[d1_databases]]
binding = "DB"
database_name = "halock-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Optional KV for shared rate limiting across isolates (create with: wrangler kv namespace create RATE_LIMIT).
# Without it, rate limiting falls back to per-isolate in-memory windows (documented).
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[vars]
# Origin allowed to call the API when served separately. When using [assets]
# above, the app is same-origin and this can stay as is.
ALLOWED_ORIGIN = "*"

# Session lifetime in days.
SESSION_TTL_DAYS = "30"

# Secrets (set with `wrangler secret put <NAME>`, never commit them):
#   SESSION_SECRET  — optional pepper for session token hashing (recommended).
